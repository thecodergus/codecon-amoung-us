[project]
name = "codecon-amoung-us"
version = "0.1.0"
description = "MVP multiplayer estilo Among Us: servidor autoritativo TCP, protocolo msgspec, mapa Tiled e cliente Pygame"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "pygame==2.6.1",
    "msgspec>=0.21,<0.22",
    "pytiled-parser>=2.2.9,<3",
    "pygame-menu==4.5.2",
    "cython>=3.3.0",
]

[project.scripts]
codecon-amoung-us = "codecon_amoung_us:main"
codecon-amoung-us-server = "codecon_amoung_us.net.server:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "hypothesis>=6,<7",
    "ruff>=0.16,<0.17",
    "mypy>=2,<3",
    "pytest-timeout==2.4.0",
    "pytest-cov>=6,<7",
    # necessário no venv para `cythonize -i` / build_ext --inplace no loop de dev
    # (venvs do uv não incluem setuptools; ver plans/cython-pure-python-mode.md)
    "setuptools>=77",
]

[build-system]
# uv_build só suporta Python puro; extensões Cython exigem outro backend.
requires = ["setuptools>=77", "cython>=3.3.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
# stubs de terceiros seguem convenções próprias (aliases sem `type`, TypeVar legado)
extend-exclude = ["typings"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
fixable = ["ALL"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = ["src", "typings"]
# setup.py é glue de build sobre setuptools/Cython.Build (não tipados)
exclude = "^setup\\.py$"
show_error_codes = true

[[tool.mypy.overrides]]
# Módulos-kernel Cython: subscrições de memoryview (cython.uchar[::1],
# cython.double[::1]) não são representáveis no stub (typings/cython.pyi) —
# o corpo desses módulos é verificado por equivalência de runtime, não pelo mypy.
module = [
    "codecon_amoung_us.ui._native_pixels",
    "codecon_amoung_us.game._native_collision",
]
disable_error_code = ["index", "misc", "type-arg", "valid-type", "attr-defined", "arg-type"]

[tool.coverage.run]
source = ["codecon_amoung_us"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=codecon_amoung_us --cov-report=term-missing"
markers = [
    "slow: testes lentos (rede, integração longa)",
    "integration: testes de integração com sockets/threads",
    "ui: testes de interface (requerem pygame)",
]
timeout = 15
