name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv + Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync dependências
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: mypy strict
        run: uv run mypy .

      - name: pytest
        run: uv run pytest
        env:
          SDL_VIDEODRIVER: dummy

      - name: smoke multiplayer E2E
        run: uv run python scripts/smoke_multiplayer.py

      - name: uv audit (informativo)
        run: uv audit
        continue-on-error: true

  assets-freshness:
    name: Frescor dos assets gerados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv + Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync dependências
        run: uv sync --frozen

      - name: Builder --check (assets == saída do gerador)
        run: uv run python scripts/build_lab_map.py --check

  ui-xvfb:
    name: UI sob X real (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv + Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Instalar Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Sync dependências
        run: uv sync --frozen

      # SDL_VIDEODRIVER=x11 é respeitado: os testes usam
      # os.environ.setdefault("SDL_VIDEODRIVER", "dummy").
      - name: pytest UI sob driver x11 (servidor X virtual)
        run: xvfb-run -a uv run pytest tests/test_ui_components.py tests/test_ui_events.py tests/test_visual_regression.py tests/test_ui_smoke.py
        env:
          SDL_VIDEODRIVER: x11
